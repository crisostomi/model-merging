_target_: model_merging.merger.interference_aware_merger.InterferenceAwareMerger

# Per-layer-type SVD rank (number of singular values to retain per task)
# Based on Phase 1 analysis: MLP/attention need more rank than projection/embedding
rank_per_type:
  mlp: 32
  attention: 32
  projection: 16
  conv: 16
  embedding: 8

default_rank: 32

# Per-layer-type alpha scaling
# Based on Phase 1: LayerNorm/bias have high agreement (safe to scale up),
# MLP/attention have low agreement (need careful scaling)
alpha_per_type:
  layernorm: 1.0
  bias: 1.0
  mlp: 1.0
  attention: 1.0
  projection: 1.0
  conv: 1.0
  embedding: 1.0

default_alpha: 1.0

# Whether to apply isotropic scaling (replace SVs with mean) after concatenation
use_isotropic: false

# Marchenko-Pastur edge adaptive rank selection
# If true, ignores rank_per_type and uses MP edge to determine rank per layer
use_mp_edge: false
mp_min_rank: 4    # minimum SVs to retain even if MP says fewer
mp_max_rank: 128  # maximum SVs to retain even if MP says more
